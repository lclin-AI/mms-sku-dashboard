name: MMS SKU frequent (today)

# Near-real-time refresh of TODAY only (the one date that changes intraday).
# GitHub cron is best-effort: "*/5" means "about every 5 min", not exact.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: mms-frequent
  cancel-in-progress: true   # if a run is still going, skip the stale one

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://owdshvgtkikubkphtfww.supabase.co
      MMS_STORES: B0812001
      MMS_DAYS: "1"          # today only — light
      MMS_STATE_FILE: ${{ github.workspace }}/mms_state.json
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MMS_USERCODE: ${{ secrets.MMS_USERCODE }}
      MMS_PASSWORD: ${{ secrets.MMS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Reuse the logged-in browser session across runs so we are not doing a
      # fresh password login every 5 minutes (which looks like abuse and gets
      # challenged). The token lives ~30 min; a valid cached session skips login.
      - name: Restore MMS session
        uses: actions/cache@v4
        with:
          path: mms_state.json
          key: mms-state-${{ github.run_id }}
          restore-keys: mms-state-

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl playwright
          python -m playwright install --with-deps chromium

      - name: Run load (today)
        run: python run_daily.py

      - name: Upload login screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login_failed
          path: login_failed.png
          if-no-files-found: ignore
