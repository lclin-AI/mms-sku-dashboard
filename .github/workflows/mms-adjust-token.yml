name: MMS adjust token feeder

# Keeps a fresh MMS token in Supabase (app_settings.mms_adjust_token) so the
# mms-adjust Edge Function can write inventory. The token lives ~30 min; refresh
# well inside that. GitHub cron is best-effort, so the Edge Function also checks
# expiry and can trigger this workflow on demand (workflow_dispatch).
on:
  schedule:
    - cron: "*/8 * * * *"
  workflow_dispatch: {}

concurrency:
  group: mms-adjust-token
  cancel-in-progress: true

jobs:
  mint:
    if: ${{ false }}   # MMS SUSPENDED 2026-09-12 — remove this line to re-enable
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: https://owdshvgtkikubkphtfww.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MMS_ADJ_USERCODE: ${{ secrets.MMS_ADJ_USERCODE }}
      MMS_ADJ_PASSWORD: ${{ secrets.MMS_ADJ_PASSWORD }}
      MMS_STATE_FILE: ${{ github.workspace }}/mms_adjust_state.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore adjust-account session
        uses: actions/cache@v4
        with:
          path: mms_adjust_state.json
          key: mms-adjust-state-${{ github.run_id }}
          restore-keys: mms-adjust-state-

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Mint + store token
        run: python mms_adjust_token_feeder.py

      - name: Upload login screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: adjust_login_failed
          path: login_failed.png
          if-no-files-found: ignore
