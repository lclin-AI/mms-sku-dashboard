<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKU Inventory Tracker</title>
<script src="config.js"></script>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#14161a; --muted:#6b7280; --line:#e4e7ec;
  --accent:#4f46e5; --accent-soft:#eef2ff; --po:#0d9488; --gr:#2563eb;
  --disp:#b45309; --sale:#4f46e5; --today:#fef9c3;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --panel:#171a21; --ink:#e8eaed; --muted:#9aa3af; --line:#282d38;
  --accent:#8b8cf9; --accent-soft:#20233340; --po:#2dd4bf; --gr:#60a5fa;
  --disp:#fbbf24; --sale:#a5b4fc; --today:#3f3f1a;
}}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a21; --ink:#e8eaed; --muted:#9aa3af; --line:#282d38;
  --accent:#8b8cf9; --accent-soft:#20233340; --po:#2dd4bf; --gr:#60a5fa;
  --disp:#fbbf24; --sale:#a5b4fc; --today:#3f3f1a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 "Noto Sans HK",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:26px 18px 60px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.nav a{color:var(--accent);text-decoration:none;font-size:13px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
input,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px}
#skuSearch{width:210px}#skuSelect{width:420px;max-width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin:2px 0 12px}
.legend b{color:var(--ink)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
tbody tr:hover{background:var(--accent-soft)}
tr.today td{background:var(--today)}
.po{color:var(--po);font-variant-numeric:tabular-nums}
.gr{color:var(--gr);font-variant-numeric:tabular-nums}
.disp{color:var(--disp);font-variant-numeric:tabular-nums}
.sale{color:var(--sale);font-variant-numeric:tabular-nums}
.dim{color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.badge{display:inline-block;background:var(--accent-soft);color:var(--accent);border:1px solid var(--line);
  border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600}
.note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6}
.rangebtns button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  border-radius:8px;padding:8px 12px;cursor:pointer}
.rangebtns button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.adjbtn{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);
  border-radius:8px;padding:8px 14px;cursor:pointer}
.adjbtn:hover{background:var(--accent);color:#fff}
.modal-back{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:420px;
  box-shadow:0 20px 60px #0006}
.modal-h{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.modal label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin:12px 0 5px}
.modal input[type=number],.modal input[type=password]{width:100%}
.modeseg{display:flex;gap:8px}
.modeseg button{flex:1;font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  border-radius:8px;padding:9px 0;cursor:pointer}
.modeseg button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal-row{display:flex;gap:10px;margin-top:18px}
.modal-row button{flex:1;font:inherit;font-weight:600;border-radius:8px;padding:10px 0;cursor:pointer;border:1px solid var(--line)}
.btn-ghost{background:var(--panel);color:var(--muted)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-danger{background:#dc2626;color:#fff;border-color:#dc2626}
.adm-preview{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);
  font-size:14px;line-height:1.7}
.adm-preview b{font-size:18px;font-variant-numeric:tabular-nums}
.adm-msg{margin-top:12px;font-size:13px}
.adm-err{color:#dc2626}.adm-ok{color:var(--po)}
.histtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.histtbl th,.histtbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.histtbl th:first-child,.histtbl td:first-child,.histtbl th:nth-child(2),.histtbl td:nth-child(2){text-align:left}
.histtbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);position:sticky;top:0;background:var(--panel)}
.mode-add{color:var(--po);font-weight:600}.mode-deduct{color:#dc2626;font-weight:600}.mode-set{color:var(--accent);font-weight:600}
.freshbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;font-size:11.5px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;
  padding:3px 10px;color:var(--muted);background:var(--panel)}
.chip b{color:var(--ink);font-weight:600}
.chip .dot{width:7px;height:7px;border-radius:99px;background:var(--po);flex:none}
.chip.stale{border-color:#f59e0b;color:#b45309}
.chip.stale .dot{background:#f59e0b}
.chip.old{border-color:#dc2626;color:#dc2626}
.chip.old .dot{background:#dc2626}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="index.html">← 銷售 Dashboard</a></div>
  <h1>SKU Inventory Tracker</h1>
  <p class="sub" id="subtitle">iMAX PO / GR · 棄置 · 銷售 — 逐日 by SKU</p>
  <div id="adjustBar" style="display:none;margin:-10px 0 18px">
    <button id="adjustBtn" class="adjbtn">✎ 手動調整庫存（MMS）</button>
    <button id="historyBtn" class="adjbtn" style="margin-left:8px">📋 調整記錄</button>
  </div>

  <div class="panel">
    <div class="controls">
      <div class="field">
        <label for="storeSelect">商店編號</label>
        <select id="storeSelect"></select>
      </div>
      <div class="field">
        <label for="skuSearch">搜尋 SKU</label>
        <input id="skuSearch" type="search" placeholder="SKU ID 或名稱…" autocomplete="off">
      </div>
      <div class="field" style="flex:1">
        <label for="skuSelect">SKU</label>
        <select id="skuSelect"></select>
      </div>
      <div class="field">
        <label>日期範圍</label>
        <div class="rangebtns" id="rangeBtns">
          <button data-back="7" data-fwd="14" aria-pressed="true">-7 / +14 日</button>
          <button data-back="30" data-fwd="14" aria-pressed="false">-30 / +14 日</button>
        </div>
      </div>
    </div>

    <div class="legend">
      <span><b class="po">PO</b> 訂貨量（booking date）</span>
      <span><b class="gr">GR</b> 收貨量</span>
      <span><b class="disp">棄置</b> 移去 R/X location（待接）</span>
      <span><b class="sale">已售</b> dashboard 銷量（送貨日）</span>
    </div>

    <div class="freshbar" id="freshbar" title="每個資料來源嘅最後更新時間"></div>

    <div id="content"><div class="empty">揀一個 SKU 開始。</div></div>
    <div class="note" id="note"></div>
  </div>
</div>

<div id="adjModal" class="modal-back" style="display:none">
  <div class="modal">
    <div class="modal-h">✎ 手動調整庫存 <span id="admSku" class="badge"></span></div>
    <div id="admName" class="sub" style="margin:-6px 0 4px"></div>

    <label>動作</label>
    <div class="modeseg" id="admMode">
      <button data-mode="add" aria-pressed="true">加 Add</button>
      <button data-mode="deduct" aria-pressed="false">減 Deduct</button>
      <button data-mode="set" aria-pressed="false">設定 Set</button>
    </div>

    <label for="admQty" id="admQtyLabel">數量</label>
    <input id="admQty" type="number" min="0" max="100000" step="1" placeholder="0">

    <label for="admOp">操作人（選填，會記入記錄）</label>
    <input id="admOp" type="text" autocomplete="off" placeholder="例如你個名/花名">

    <label for="admPw">密碼</label>
    <input id="admPw" type="password" autocomplete="off" placeholder="調整密碼">

    <div id="admPreview" class="adm-preview" style="display:none"></div>
    <div id="admMsg" class="adm-msg"></div>

    <div class="modal-row">
      <button class="btn-ghost" id="admCancel">取消</button>
      <button class="btn-primary" id="admPreviewBtn">預覽</button>
      <button class="btn-danger" id="admConfirmBtn" style="display:none">確認寫入</button>
    </div>
  </div>
</div>

<div id="histModal" class="modal-back" style="display:none">
  <div class="modal" style="max-width:640px">
    <div class="modal-h">📋 調整記錄
      <label style="font-size:12px;font-weight:400;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:5px">
        <input type="checkbox" id="histThisSku" style="width:auto"> 只睇呢隻 SKU
      </label>
    </div>
    <div id="histBody" style="max-height:60vh;overflow:auto"></div>
    <div class="modal-row"><button class="btn-ghost" id="histClose">關閉</button></div>
  </div>
</div>

<script>
const CFG = window.DASH_CONFIG || {};
const REST = CFG.SUPABASE_URL + "/rest/v1";
const HEAD = { apikey: CFG.SUPABASE_ANON_KEY, Authorization: "Bearer " + CFG.SUPABASE_ANON_KEY };
const $ = id => document.getElementById(id);
const fmtN = n => (n===null||n===undefined) ? "" : Number(n).toLocaleString("en-US",{maximumFractionDigits:0});

let state = { store: CFG.DEFAULT_STORE, sku: "", catalog: [], back: 7, fwd: 14, showPast: false };

async function api(path){ const r = await fetch(REST+path,{headers:HEAD});
  if(!r.ok) throw new Error(r.status+" "+await r.text()); return r.json(); }

function todayHK(){
  const s = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Hong_Kong",
    year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  return s; // YYYY-MM-DD
}
function addDays(iso, n){ const d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n);
  return d.toISOString().slice(0,10); }

async function loadStores(){
  const rows = await api("/imax_daily?select=store_code&limit=5000")
    .catch(()=>[]);
  let stores=[...new Set(rows.map(r=>r.store_code))];
  if(!stores.length){ const c=await api("/mms_sku_catalog?select=store_code&limit=5000");
    stores=[...new Set(c.map(r=>r.store_code))]; }
  stores.sort();
  if(!stores.includes(state.store) && stores.length) state.store=stores[0];
  $("storeSelect").innerHTML = stores.map(s=>`<option${s===state.store?" selected":""}>${s}</option>`).join("");
  return stores;
}

async function loadCatalog(){
  // Sold SKUs (with names + volume) first; then any other store SKU that has
  // IIMS data (e.g. by-date SKUs like 10040 that never sold) so they are
  // selectable too.
  const [sold, iimsSkus] = await Promise.all([
    api(`/mms_sku_catalog?store_code=eq.${state.store}&select=sku_id,sku_name_zh,sku_name_en,qty_total&order=qty_total.desc&limit=5000`),
    api(`/imax_iims_sku?store_code=eq.${state.store}&select=sku_id&limit=10000`).catch(()=>[]),
  ]);
  const have = new Set(sold.map(r=>r.sku_id));
  const extra = iimsSkus.map(r=>r.sku_id).filter(id=>!have.has(id)).sort()
    .map(id=>({sku_id:id, sku_name_zh:"", sku_name_en:"", qty_total:0}));
  state.catalog = sold.concat(extra);
  renderSkuOptions();
}
function renderSkuOptions(){
  const q=$("skuSearch").value.trim().toLowerCase();
  const list=state.catalog.filter(c=>!q||c.sku_id.toLowerCase().includes(q)||
    (c.sku_name_zh||"").toLowerCase().includes(q)||(c.sku_name_en||"").toLowerCase().includes(q));
  $("skuSelect").innerHTML = `<option value="">— 揀 SKU —</option>` +
    list.map(c=>`<option value="${c.sku_id}"${c.sku_id===state.sku?" selected":""}>`+
      `${c.sku_id} · ${(c.sku_name_zh||c.sku_name_en||"").slice(0,40)}</option>`).join("");
}

async function render(){
  if(!state.sku){ $("content").innerHTML='<div class="empty">揀一個 SKU 開始。</div>'; $("note").textContent=""; $("adjustBar").style.display="none"; return; }
  const c = state.catalog.find(x=>x.sku_id===state.sku);
  $("subtitle").innerHTML = `<span class="badge">${state.sku}</span> ${c?(c.sku_name_zh||c.sku_name_en||""):""}`;
  $("adjustBar").style.display = CFG.ADJUST_FN_URL ? "" : "none";

  const skuF = encodeURIComponent(state.sku);
  const [imax, sales, stock6, iimsSku, iimsBd, expressRows, snapMinR, snapMaxR] = await Promise.all([
    api(`/imax_daily?store_code=eq.${state.store}&sku_id=eq.${skuF}`+
        `&select=date,po_qty,gr_qty,disposal_qty&limit=5000`),
    api(`/mms_sku_daily?store_code=eq.${state.store}&sku_id=eq.${skuF}`+
        `&select=delivery_date,qty&limit=20000`),
    api(`/imax_stock_6pm?store_code=eq.${state.store}&sku_id=eq.${skuF}`+
        `&select=date,phys_qty&limit=5000`),
    api(`/imax_iims_sku?store_code=eq.${state.store}&sku_id=eq.${skuF}&select=quantity,has_bydate,update_stock_time`),
    api(`/imax_iims_bydate?store_code=eq.${state.store}&sku_id=eq.${skuF}&select=date,quantity&limit=5000`),
    api(`/mms_express_daily?store_code=eq.${state.store}&sku_id=eq.${skuF}&select=delivery_date,qty&limit=5000`).catch(()=>[]),
    api(`/imax_stock_6pm?store_code=eq.${state.store}&select=date&order=date.asc&limit=1`).catch(()=>[]),
    api(`/imax_stock_6pm?store_code=eq.${state.store}&select=date&order=date.desc&limit=1`).catch(()=>[]),
  ]);
  // dates on which a 4PM stock snapshot was actually taken (store-wide bounds):
  const snapMin = snapMinR[0] && snapMinR[0].date, snapMax = snapMaxR[0] && snapMaxR[0].date;
  const po={},gr={},disp={},sale={},phys={},iims={};
  // 已售 = standard (Daily Order Report, H orders) + express (EM, 倉存即送).
  // The Daily Report omits express, so express is added from mms_express_daily.
  for(const r of imax){ po[r.date]=r.po_qty; gr[r.date]=r.gr_qty; if(r.disposal_qty!=null) disp[r.date]=r.disposal_qty; }
  for(const r of sales){ sale[r.delivery_date]=(sale[r.delivery_date]||0)+ (+r.qty); }
  for(const r of (expressRows||[])){ sale[r.delivery_date]=(sale[r.delivery_date]||0)+ (+r.qty); }
  for(const r of stock6){ phys[r.date]=r.phys_qty; }
  for(const r of iimsBd){ iims[r.date]=r.quantity; }
  const iimsInfo = iimsSku[0] || null;
  const iimsHasBydate = iimsInfo && iimsInfo.has_bydate;
  if (iimsInfo && !iimsHasBydate)
    $("subtitle").innerHTML += ` · <span class="badge">IIMS 現貨 ${fmtN(iimsInfo.quantity)}（無 by-date）</span>`;
  // Base = GR if present, else PO if present, else 9999.
  const baseOf = dt => (gr[dt]>0 ? gr[dt] : (po[dt]>0 ? po[dt] : 9999));

  const t0=todayHK();
  // Non-by-date IIMS: a single quantity that is today's sellable before 4PM (HK)
  // and tomorrow's after 4PM. Place it on that date's row.
  const hkHour = +new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Hong_Kong",hour:"2-digit",hour12:false}).format(new Date());
  const iimsSingleDate = (!iimsHasBydate && iimsInfo) ? (hkHour < 16 ? t0 : addDays(t0,1)) : null;
  const start=addDays(t0,-state.back), end=addDays(t0,state.fwd);
  const rows=[]; let d=start;
  while(d<=end){ rows.push(d); d=addDays(d,1); }

  let tot={po:0,gr:0,sale:0};
  const cell=(v,cls)=> v===undefined||v===null ? '<td class="dim">–</td>' : `<td class="${cls}">${fmtN(v)}</td>`;
  const rowObjs = rows.map(dt=>{
    const isToday = dt===t0;
    tot.po+=po[dt]||0; tot.gr+=gr[dt]||0; tot.sale+=sale[dt]||0;
    // Remaining for date D = physical stock at 4PM of the PREVIOUS day.
    //  - snapshot has the SKU  -> that qty, but <=0 counts as no leftover (0)
    //  - snapshot day taken but SKU absent -> 0 (sold out / no leftover)
    //  - day not yet snapshotted (before 4PM) -> unknown (–)
    const snapDate = addDays(dt,-1);
    let rem;
    if (phys[snapDate] != null) rem = Math.max(0, phys[snapDate]);
    else if (snapMin && snapDate >= snapMin && snapDate <= snapMax) rem = 0;
    else rem = null;
    const base = baseOf(dt);
    const hasBase = gr[dt]>0 || po[dt]>0;   // real base (not the 9999 fallback)
    // Available = Base − Disposal − Sold + Remaining (yesterday's leftover is
    // carried-over stock that is still sellable, so it is ADDED).
    const avail = base - (disp[dt]||0) - (sale[dt]||0) + (rem!=null?rem:0);
    const availCls = avail<0 ? 'disp' : 'po';
    const iimsCell = iimsHasBydate
      ? (iims[dt]!=null ? `<td class="gr">${fmtN(iims[dt])}</td>` : '<td class="dim">–</td>')
      : (iimsSingleDate && dt===iimsSingleDate
          ? `<td class="gr" title="非 by-date：${hkHour<16?'今日':'明日'}現貨">${fmtN(iimsInfo.quantity)}</td>`
          : '<td class="dim">–</td>');
    const html = `<tr class="${isToday?'today':''}"><td>${dt}${isToday?' <span class="dim">(今日)</span>':''}</td>`+
      cell(po[dt],'po')+cell(gr[dt],'gr')+cell(disp[dt],'disp')+
      (sale[dt]?`<td class="sale">${fmtN(sale[dt])}</td>`:'<td class="dim">–</td>')+
      (rem!=null?`<td>${fmtN(rem)}</td>`:'<td class="dim">–</td>')+
      `<td class="${hasBase?'':'dim'}" title="${hasBase?'':'無 PO/GR，Base=9999'}">${fmtN(base)}</td>`+
      `<td class="${availCls}">${fmtN(avail)}</td>`+iimsCell+`</tr>`;
    return { dt, html, past: dt < t0 };
  });
  const pastN = rowObjs.filter(r=>r.past).length;
  const toggle = pastN ? `<tr class="toggle"><td colspan="9" onclick="togglePast()"
      style="cursor:pointer;color:var(--accent);font-weight:600">${
      state.showPast ? '▾ 收起之前 '+pastN+' 日' : '▸ 顯示之前 '+pastN+' 日'}</td></tr>` : "";
  const body = toggle + rowObjs.filter(r=>state.showPast || !r.past).map(r=>r.html).join("");

  const iimsHdr = iimsHasBydate ? "IIMS (by-date)"
    : (iimsInfo ? `IIMS 現貨 ${fmtN(iimsInfo.quantity)}` : "IIMS");
  $("content").innerHTML = `<div class="tbl-wrap"><table>
    <thead><tr><th>Date</th><th>PO 數量</th><th>GR 數量</th><th>棄置數量</th>
      <th>已售出數量</th><th>剩餘數量</th><th title="有 GR 用 GR，冇用 PO，都冇 = 9999">Base</th>
      <th title="Base − 棄置 − 已售 + 剩餘">可售數量</th>
      <th title="IIMS stock-levels reference">${iimsHdr}</th></tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr style="font-weight:650"><td>合計（${state.back}+${state.fwd} 日）</td>
      <td class="po">${fmtN(tot.po)}</td><td class="gr">${fmtN(tot.gr)}</td>
      <td class="dim">–</td><td class="sale">${fmtN(tot.sale)}</td>
      <td class="dim">–</td><td class="dim">–</td><td class="dim">–</td><td class="dim">–</td></tr></tfoot>
    </table></div>`;
  $("note").innerHTML =
    "<b>Base</b> = 有 GR 用 GR，冇用 PO，都冇 = 9999。<b>可售</b> = Base − 棄置 − 已售 + 剩餘。<br>"+
    "PO/GR 按 <b>booking date</b>；已售按 <b>送貨日</b>；棄置 = 當日搬入 R − 搬返出（唔計 sap_disposal）。"+
    "<b>剩餘</b> = 前一日 <b>4PM</b> 實物庫存（唔含 R/X location），每日 16:00 快照；≤0 或賣清當作 0（無 leftover），未到 4PM 嗰日顯示「–」。";
}

// Per-source freshness. Each source populates a different Supabase table with an
// updated_at; MMS refreshes in the cloud (~5 min) while iMAX/IIMS run locally, so
// the cadences differ and staleness thresholds are per-source.
const FRESH_SOURCES = [
  { label: "標準",        table: "mms_sku_daily",   stale: 30,   old: 180  },
  { label: "Express",     table: "mms_express_daily", stale: 30, old: 180  },
  { label: "iMAX PO/GR/棄置", table: "imax_daily",   stale: 180,  old: 1080 },
  { label: "剩餘4PM",     table: "imax_stock_6pm",  stale: 1560, old: 3000 },
  { label: "IIMS",        table: "imax_iims_sku",   stale: 180,  old: 1080 },
];
function relTime(iso){
  if(!iso) return "—";
  const mins = (Date.now() - new Date(iso).getTime())/60000;
  if(mins < 1) return "啱啱";
  if(mins < 60) return Math.round(mins)+" 分鐘前";
  if(mins < 1440) return Math.round(mins/60)+" 小時前";
  return Math.round(mins/1440)+" 日前";
}
async function loadFreshness(){
  const bar = $("freshbar");
  const chips = await Promise.all(FRESH_SOURCES.map(async src=>{
    let iso=null;
    try{
      const r = await api(`/${src.table}?store_code=eq.${state.store}&select=updated_at&order=updated_at.desc&limit=1`);
      iso = r && r[0] ? r[0].updated_at : null;
    }catch(e){}
    const mins = iso ? (Date.now()-new Date(iso).getTime())/60000 : Infinity;
    const cls = !iso ? "old" : mins>src.old ? "old" : mins>src.stale ? "stale" : "";
    return `<span class="chip ${cls}"><span class="dot"></span><b>${src.label}</b> ${relTime(iso)}</span>`;
  }));
  bar.innerHTML = chips.join("");
}

async function boot(){
  if(!CFG.SUPABASE_URL || CFG.SUPABASE_URL.includes("REPLACE_ME")){
    $("content").innerHTML='<div class="empty">未設定 Supabase（config.js）。</div>'; return; }
  try{
    const p = new URLSearchParams(location.search);
    if (p.get("store")) state.store = p.get("store");
    await loadStores();
    if (p.get("sku")) state.sku = p.get("sku");
    await loadCatalog();
    if (state.sku){ $("skuSelect").value = state.sku; if($("skuSelect").value!==state.sku){ // not in options: add it
        $("skuSelect").insertAdjacentHTML("beforeend", `<option value="${state.sku}" selected>${state.sku}</option>`);} }
    render();
    loadFreshness();
  }catch(e){ $("content").innerHTML=`<div class="empty">讀 Supabase 失敗：<code>${String(e.message).slice(0,200)}</code></div>`; }
}
$("storeSelect").onchange = async e=>{ state.store=e.target.value; state.sku=""; $("skuSearch").value="";
  loadFreshness(); await loadCatalog(); render(); };
window.togglePast = ()=>{ state.showPast=!state.showPast; render(); };
$("skuSearch").oninput = renderSkuOptions;
$("skuSelect").onchange = e=>{ state.sku=e.target.value; state.showPast=false; render(); };
$("rangeBtns").onclick = e=>{ const b=e.target.closest("button"); if(!b) return;
  state.back=+b.dataset.back; state.fwd=+b.dataset.fwd;
  [...e.currentTarget.children].forEach(x=>x.setAttribute("aria-pressed", x===b)); render(); };
boot();

/* ---------- Manual adjust (MMS write via Edge Function) ---------- */
let adj = { mode: "add", current: null };
const admQtyLabel = {add:"加多少（數量）", deduct:"減多少（數量）", set:"設定為（數量）"};

async function callAdjust(payload){
  try{
    const r = await fetch(CFG.ADJUST_FN_URL, {
      method:"POST",
      headers:{ "Content-Type":"application/json",
                apikey: CFG.SUPABASE_ANON_KEY,
                Authorization: "Bearer " + CFG.SUPABASE_ANON_KEY },
      body: JSON.stringify(payload),
      signal: AbortSignal.timeout(90000),
    });
    let j; try{ j = await r.json(); }catch{ j = {error:"回應格式錯誤 (HTTP "+r.status+")"}; }
    return { status:r.status, ...j };
  }catch(e){
    return { status:0, error: e.name==="TimeoutError" ? "逾時 90 秒,請再試" : ("連線失敗: "+e.message) };
  }
}
const targetOf = (cur,mode,qty)=> mode==="set"?qty : mode==="add"?cur+qty : Math.max(0,cur-qty);

function resetAdjustUI(){
  adj.current=null;
  $("admPreview").style.display="none"; $("admMsg").textContent=""; $("admMsg").className="adm-msg";
  $("admConfirmBtn").style.display="none"; $("admPreviewBtn").style.display="";
  $("admPreviewBtn").disabled=false; $("admPreviewBtn").textContent="預覽";
}
function openAdjust(){
  const c = state.catalog.find(x=>x.sku_id===state.sku);
  $("admSku").textContent = state.sku;
  $("admName").textContent = c ? (c.sku_name_zh||c.sku_name_en||"") : "";
  adj.mode="add";
  [...$("admMode").children].forEach(b=>b.setAttribute("aria-pressed", b.dataset.mode==="add"));
  $("admQtyLabel").textContent = admQtyLabel.add;
  $("admQty").value=""; $("admPw").value="";
  resetAdjustUI();
  $("adjModal").style.display="flex"; $("admQty").focus();
}
function closeAdjust(){ $("adjModal").style.display="none"; }

$("adjustBtn").onclick = openAdjust;
$("admCancel").onclick = closeAdjust;
$("adjModal").onclick = e=>{ if(e.target.id==="adjModal") closeAdjust(); };
$("admMode").onclick = e=>{ const b=e.target.closest("button"); if(!b) return;
  adj.mode=b.dataset.mode;
  [...$("admMode").children].forEach(x=>x.setAttribute("aria-pressed", x===b));
  $("admQtyLabel").textContent = admQtyLabel[adj.mode];
  resetAdjustUI();
};
["admQty","admPw"].forEach(id=> $(id).oninput = resetAdjustUI);

$("admPreviewBtn").onclick = async ()=>{
  const qty = Number($("admQty").value); const pw = $("admPw").value;
  const msg = $("admMsg");
  if(!Number.isFinite(qty) || qty<0){ msg.className="adm-msg adm-err"; msg.textContent="請輸入有效數量。"; return; }
  if(!pw){ msg.className="adm-msg adm-err"; msg.textContent="請輸入密碼。"; return; }
  $("admPreviewBtn").disabled=true; $("admPreviewBtn").textContent="讀取現貨…"; msg.textContent="";
  const res = await callAdjust({ action:"get", store_code:state.store, sku_id:state.sku, mode:adj.mode, qty, password:pw });
  $("admPreviewBtn").disabled=false; $("admPreviewBtn").textContent="預覽";
  if(!res.ok){ msg.className="adm-msg adm-err"; msg.textContent="✗ "+(res.error||("HTTP "+res.status)); return; }
  adj.current = res.current;
  const tgt = targetOf(res.current, adj.mode, qty);
  const verb = {add:"加",deduct:"減",set:"設定"}[adj.mode];
  $("admPreview").style.display="";
  $("admPreview").innerHTML = `現時 <b>${fmtN(res.current)}</b> `+
    `— ${verb} ${fmtN(qty)} → 將變成 <b>${fmtN(tgt)}</b>`;
  $("admPreviewBtn").style.display="none"; $("admConfirmBtn").style.display="";
  $("admConfirmBtn").disabled=false; $("admConfirmBtn").textContent="確認寫入";
};

$("admConfirmBtn").onclick = async ()=>{
  const qty = Number($("admQty").value); const pw = $("admPw").value; const msg = $("admMsg");
  $("admConfirmBtn").disabled=true; $("admConfirmBtn").textContent="寫入中…"; msg.textContent="";
  const res = await callAdjust({ store_code:state.store, sku_id:state.sku, mode:adj.mode, qty, password:pw, operator:($("admOp").value||"").trim()||undefined });
  if(!res.ok){ msg.className="adm-msg adm-err"; msg.textContent="✗ "+(res.error||("HTTP "+res.status));
    $("admConfirmBtn").disabled=false; $("admConfirmBtn").textContent="確認寫入"; return; }
  msg.className="adm-msg adm-ok";
  msg.textContent = `✅ 已寫入：${fmtN(res.before)} → ${fmtN(res.after)}（倉 ${res.warehouseSeqNo}）。dashboard 數字下次同步後更新。`;
  $("admConfirmBtn").style.display="none";
  $("admPreview").style.display="none";
};

/* ---------- Adjustment history log ---------- */
async function loadHistory(){
  const body = $("histBody");
  body.innerHTML = '<div class="empty" style="padding:20px">載入中…</div>';
  let q = `/adjust_log?store_code=eq.${state.store}&order=ts.desc&limit=100`+
          `&select=ts,sku_id,sku_name,mode,qty,before_qty,after_qty,operator,status,error`;
  if($("histThisSku").checked && state.sku) q += `&sku_id=eq.${encodeURIComponent(state.sku)}`;
  let rows=[]; try{ rows = await api(q); }
  catch(e){ body.innerHTML='<div class="empty" style="padding:20px">讀取失敗（未建 adjust_log 表？）</div>'; return; }
  if(!rows.length){ body.innerHTML='<div class="empty" style="padding:20px">未有調整記錄。</div>'; return; }
  const modeLabel={add:"加 Add",deduct:"減 Deduct",set:"設定 Set"};
  const fmtTs=iso=>new Date(iso).toLocaleString("zh-HK",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
  const esc=s=>String(s||"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
  body.innerHTML = `<table class="histtbl"><thead><tr>`+
    `<th>狀態</th><th>時間</th><th>SKU</th><th>動作</th><th>數量</th><th>由 → 到</th><th>操作人</th></tr></thead><tbody>`+
    rows.map(r=>{
      const ok = r.status !== "fail";
      const badge = ok ? `<span style="color:var(--po);font-weight:700">✓</span>`
        : `<span style="color:#dc2626;font-weight:700" title="${esc(r.error)}">✗</span>`;
      const toTo = ok ? `${fmtN(r.before_qty)} → <b>${fmtN(r.after_qty)}</b>`
        : `<span class="dim" title="${esc(r.error)}">${fmtN(r.before_qty)} → 失敗</span>`;
      return `<tr${ok?"":' style="opacity:.8"'}>`+
        `<td style="text-align:center">${badge}</td>`+
        `<td>${fmtTs(r.ts)}</td>`+
        `<td><span class="badge">${r.sku_id}</span> ${esc((r.sku_name||"").slice(0,12))}</td>`+
        `<td class="mode-${r.mode}">${modeLabel[r.mode]||r.mode}</td>`+
        `<td>${fmtN(r.qty)}</td>`+
        `<td>${toTo}</td>`+
        `<td>${r.operator?esc(String(r.operator).slice(0,20)):"—"}</td></tr>`;
    }).join("")+
    `</tbody></table>`;
}
$("historyBtn").onclick = ()=>{ $("histModal").style.display="flex"; loadHistory(); };
$("histClose").onclick = ()=>{ $("histModal").style.display="none"; };
$("histModal").onclick = e=>{ if(e.target.id==="histModal") $("histModal").style.display="none"; };
$("histThisSku").onchange = loadHistory;
</script>
